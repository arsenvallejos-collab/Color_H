name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            extra: ""
          - os: macos-latest
            name: Mac
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Save the plugin so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: BomBapColor-${{ matrix.name }}
          path: build/BomBapColor_artefacts
